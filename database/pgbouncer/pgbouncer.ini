[databases]
brightloop_db = host=postgres port=5432 dbname=brightloop_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
reserve_pool_size = 5

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
